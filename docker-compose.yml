services:
  postgres:
    image: postgres:16-alpine
    container_name: atendente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: (f"{POSTGRES_USER}")
      POSTGRES_PASSWORD: (f"{POSTGRES_PASSWORD}")
      POSTGRES_DB: atendente
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atendente"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atendente-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: